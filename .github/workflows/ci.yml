name: CI
on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Build Web Assets for Embedded Server
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Run Go Tests
        run: go test -v -count=1 ./...

  test-frontend:
    name: Frontend Lint & Build (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Check Formatting
        working-directory: web
        run: yarn format:check

      - name: Build Frontend
        working-directory: web
        run: yarn build

  desktop-matrix-build:
    name: Desktop Build Verification (${{ matrix.os }})
    needs: [test-go, test-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev python3-cairo python3-gi gir1.2-rsvg-2.0

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg || true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Web Assets
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Prepare Desktop Assets
        run: |
          mkdir -p cmd/desktop/build/bin build/bin
          cp -rf build/windows cmd/desktop/build/ 2>/dev/null || true
          cp -f build/appicon.png cmd/desktop/build/ 2>/dev/null || true
          node -e "
            const fs = require('fs');
            const path = require('path');
            const wailsPath = path.resolve('wails.json');
            const wails = JSON.parse(fs.readFileSync(wailsPath, 'utf8'));
            wails.projectdir = path.resolve('cmd/desktop');
            fs.writeFileSync(wailsPath, JSON.stringify(wails, null, 2));
          "

      - name: Verify Desktop Compilation (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -clean -skipbindings -ldflags "-s -w"
          bash scripts/package-deb.sh --no-build

      - name: Verify Desktop Compilation (Windows)
        if: runner.os == 'Windows'
        run: |
          wails build -platform windows/amd64 -nsis -clean -skipbindings -ldflags "-s -w"

      - name: Verify Desktop Compilation (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/package-macos.sh --no-frontend
