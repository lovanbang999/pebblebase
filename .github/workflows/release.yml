name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  # ─── 1. Release initialization ──────────────────────────────────────────────
  init-release:
    name: Initialize GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "Pebblebase Studio ${{ env.RELEASE_TAG }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false || true

  # ─── 2. Desktop Builds: Wails Matrix (macOS, Windows, Linux) ─────────────────
  wails-build:
    name: Desktop Build (${{ matrix.os }})
    needs: init-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: pebblebase-darwin-universal
          - os: windows-latest
            artifact_name: pebblebase-windows-amd64
          - os: ubuntu-22.04
            artifact_name: pebblebase-linux-amd64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Web Assets
        run: |
          cd web
          yarn install --frozen-lockfile
          yarn build

      - name: Build Desktop App (macOS)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal -clean
          mkdir -p build/bin
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent pebblebase.app pebblebase-darwin-universal.app.zip
          shasum -a 256 pebblebase-darwin-universal.app.zip > pebblebase-darwin-universal.app.zip.sha256

      - name: Build Desktop App (Windows)
        if: runner.os == 'Windows'
        run: |
          wails build -platform windows/amd64 -clean
          mkdir -p build/bin
          cd build/bin
          powershell Compress-Archive -Path pebblebase.exe -DestinationPath pebblebase-windows-amd64.zip
          certutil -hashfile pebblebase-windows-amd64.zip SHA256 | findstr /V ":" > pebblebase-windows-amd64.zip.sha256

      - name: Build Desktop App (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -clean
          mkdir -p build/bin
          cd build/bin
          tar -czvf pebblebase-linux-amd64.tar.gz pebblebase
          sha256sum pebblebase-linux-amd64.tar.gz > pebblebase-linux-amd64.tar.gz.sha256

      - name: Upload Desktop Artifacts to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/bin
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" \) -exec gh release upload "${{ env.RELEASE_TAG }}" {} --clobber \;
