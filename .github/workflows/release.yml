name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  # ─── 1. Release initialization ──────────────────────────────────────────────
  init-release:
    name: Initialize GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "Pebblebase Studio ${{ env.RELEASE_TAG }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false || true

  # ─── 2. Desktop Builds: Wails Matrix (macOS, Windows, Linux) ─────────────────
  wails-build:
    name: Desktop Build (${{ matrix.os }})
    needs: init-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: pebblebase-darwin-universal
          - os: windows-latest
            artifact_name: pebblebase-windows-amd64
          - os: ubuntu-22.04
            artifact_name: pebblebase-linux-amd64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Synchronize Release Version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Synchronizing release version: $VERSION (from tag $RELEASE_TAG)"
          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_TAG ? process.env.RELEASE_TAG.replace(/^v/, '') : '1.0.0';

            // 1. Update web/package.json
            const pkgPath = 'web/package.json';
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Synchronized web/package.json to version:', version);
            }

            // 2. Update web/index.html splash badge
            const htmlPath = 'web/index.html';
            if (fs.existsSync(htmlPath)) {
              let html = fs.readFileSync(htmlPath, 'utf8');
              html = html.replace(/<span class=\"pb-splash-badge\">v[^<]*<\/span>/, '<span class=\"pb-splash-badge\">v' + version + '</span>');
              fs.writeFileSync(htmlPath, html, 'utf8');
              console.log('Synchronized web/index.html to version: v' + version);
            }

            // 3. Update internal/app/bootstrap.go
            const bootstrapPath = 'internal/app/bootstrap.go';
            if (fs.existsSync(bootstrapPath)) {
              let content = fs.readFileSync(bootstrapPath, 'utf8');
              content = content.replace(/var Version = \"[^\"]*\"/, 'var Version = \"' + version + '\"');
              fs.writeFileSync(bootstrapPath, content, 'utf8');
              console.log('Synchronized internal/app/bootstrap.go to Version:', version);
            }

            // 4. Update wails.json
            const wailsPath = 'wails.json';
            if (fs.existsSync(wailsPath)) {
              const wails = JSON.parse(fs.readFileSync(wailsPath, 'utf8'));
              if (wails.info) {
                wails.info.productVersion = version;
              }
              fs.writeFileSync(wailsPath, JSON.stringify(wails, null, 2) + '\n');
              console.log('Synchronized wails.json productVersion to:', version);
            }
          "

      - name: Build Web Assets
        run: |
          cd web
          yarn install --frozen-lockfile
          yarn build

      - name: Prepare Desktop Build Assets
        run: |
          mkdir -p cmd/desktop/build/bin build/bin
          cp -rf build/windows cmd/desktop/build/ 2>/dev/null || true
          cp -rf cmd/desktop/build/windows build/ 2>/dev/null || true
          cp -f build/appicon.png cmd/desktop/build/ 2>/dev/null || true
          node -e "
            const fs = require('fs');
            const path = require('path');
            const wailsPath = path.resolve('wails.json');
            const wails = JSON.parse(fs.readFileSync(wailsPath, 'utf8'));
            wails.projectdir = path.resolve('cmd/desktop');
            const version = process.env.RELEASE_TAG ? process.env.RELEASE_TAG.replace(/^v/, '') : '1.0.0';
            if (wails.info) {
              wails.info.productVersion = version;
            }
            fs.writeFileSync(wailsPath, JSON.stringify(wails, null, 2));
            console.log('Configured absolute projectdir:', wails.projectdir, 'productVersion:', version);
          "

      - name: Build Desktop App (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p cmd/desktop/build/bin build/bin
          wails build -platform darwin/universal -clean -skipbindings -ldflags "-s -w -X pebblebase/internal/app.Version=${VERSION}"
          if [ -d "cmd/desktop/build/bin/pebblebase.app" ]; then
            cp -rf cmd/desktop/build/bin/pebblebase.app build/bin/
          fi
          if [ ! -d "build/bin/pebblebase.app" ]; then
            FOUND_APP=$(find cmd/desktop build -name "pebblebase.app" -type d 2>/dev/null | head -n 1)
            if [ -n "$FOUND_APP" ]; then
              cp -rf "$FOUND_APP" build/bin/
            fi
          fi
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent pebblebase.app pebblebase-darwin-universal.app.zip
          shasum -a 256 pebblebase-darwin-universal.app.zip > pebblebase-darwin-universal.app.zip.sha256

      - name: Build Desktop App (Windows)
        if: runner.os == 'Windows'
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p cmd/desktop/build/bin build/bin
          wails build -platform windows/amd64 -clean -skipbindings -ldflags "-s -w -X pebblebase/internal/app.Version=${VERSION}"
          if [ -f "cmd/desktop/build/bin/pebblebase.exe" ]; then
            cp -f cmd/desktop/build/bin/pebblebase.exe build/bin/
          fi
          if [ ! -f "build/bin/pebblebase.exe" ]; then
            FOUND_EXE=$(find cmd/desktop build -name "pebblebase.exe" -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND_EXE" ]; then
              cp -f "$FOUND_EXE" build/bin/
            fi
          fi
          cd build/bin
          powershell Compress-Archive -Force -Path pebblebase.exe -DestinationPath pebblebase-windows-amd64.zip
          if command -v sha256sum &> /dev/null; then
            sha256sum pebblebase-windows-amd64.zip > pebblebase-windows-amd64.zip.sha256
          else
            certutil -hashfile pebblebase-windows-amd64.zip SHA256 | findstr /V ":" > pebblebase-windows-amd64.zip.sha256
          fi

      - name: Build Desktop App (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p cmd/desktop/build/bin build/bin
          wails build -platform linux/amd64 -clean -skipbindings -ldflags "-s -w -X pebblebase/internal/app.Version=${VERSION}"
          if [ -f "cmd/desktop/build/bin/pebblebase" ]; then
            cp -f cmd/desktop/build/bin/pebblebase build/bin/
          fi
          if [ ! -f "build/bin/pebblebase" ]; then
            FOUND_BIN=$(find cmd/desktop build -name "pebblebase" -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND_BIN" ]; then
              cp -f "$FOUND_BIN" build/bin/
            fi
          fi
          cd build/bin
          tar -czvf pebblebase-linux-amd64.tar.gz pebblebase
          sha256sum pebblebase-linux-amd64.tar.gz > pebblebase-linux-amd64.tar.gz.sha256

      - name: Upload Desktop Artifacts to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/bin
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" \) -exec gh release upload "${{ env.RELEASE_TAG }}" {} --clobber \;
