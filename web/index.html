<!doctype html>
<html lang="en" class="dark" style="background-color: #09090b; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pebblebase Studio</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        background-color: #09090b !important;
        color: #fafafa;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #09090b;
      }
      .pb-splash-container {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #09090b;
        overflow: hidden;
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s ease;
        pointer-events: auto;
      }
      .pb-splash-container.pb-splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pb-splash-glow {
        position: absolute;
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(9, 9, 11, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .pb-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 10;
      }
      .pb-splash-logo-box {
        width: 64px;
        height: 64px;
        min-width: 64px;
        min-height: 64px;
        max-width: 64px;
        max-height: 64px;
        border-radius: 14px;
        background: rgba(24, 24, 27, 0.7);
        border: 1px solid rgba(63, 63, 70, 0.4);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        margin-bottom: 20px;
        backdrop-filter: blur(8px);
        animation: pb-float 3s ease-in-out infinite;
      }
      .pb-splash-logo-box img {
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        max-width: 44px;
        max-height: 44px;
        display: block;
        object-fit: contain;
      }
      .pb-splash-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 28px;
        color: #f4f4f5;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pb-splash-badge {
        font-size: 10px;
        font-weight: 600;
        line-height: 14px;
        color: #34d399;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.25);
        padding: 2px 7px;
        border-radius: 9999px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .pb-splash-subtitle {
        font-size: 12px;
        line-height: 16px;
        color: #71717a;
        margin: 0 0 24px 0;
        letter-spacing: -0.01em;
      }
      .pb-splash-bar-track {
        width: 180px;
        height: 3px;
        background: rgba(39, 39, 42, 0.8);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .pb-splash-bar-thumb {
        position: absolute;
        top: 0;
        left: -40%;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #10b981, #34d399, transparent);
        border-radius: 9999px;
        animation: pb-indeterminate 1.4s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
      }
      @keyframes pb-indeterminate {
        0% { left: -40%; width: 40%; }
        50% { left: 40%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
      @keyframes pb-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
    </style>
    <script>
      (function() {
        var t = localStorage.getItem('pb_theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }

        // Two requestAnimationFrame ticks ensure the browser compositor has flushed pixels to the screen
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            if (window.runtime && typeof window.runtime.WindowShow === 'function') {
              window.runtime.WindowShow();
            }
          });
        });
      })();
    </script>
  </head>
  <body style="background-color: #09090b; margin: 0; padding: 0;">
    <div id="pb-splash" class="pb-splash-container">
      <div class="pb-splash-glow"></div>
      <div class="pb-splash-card">
        <div class="pb-splash-logo-box" style="width: 64px; height: 64px; min-width: 64px; min-height: 64px; padding: 10px; box-sizing: border-box;">
          <img src="/favicon.svg" alt="Pebblebase" width="44" height="44" style="width: 44px; height: 44px; min-width: 44px; min-height: 44px; max-width: 44px; max-height: 44px; display: block; object-fit: contain; box-sizing: border-box;" />
        </div>
        <h1 class="pb-splash-title">
          Pebblebase Studio
          <span class="pb-splash-badge">v0.1.1</span>
        </h1>
        <p class="pb-splash-subtitle">Initializing Studio...</p>
        <div class="pb-splash-bar-track">
          <div class="pb-splash-bar-thumb"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
