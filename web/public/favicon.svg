    <linearGradient id="pb-top-grad" x1="26" y1="24" x2="102" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pb-mid-grad" x1="26" y1="54" x2="102" y2="82" gradientUnits="userSpaceOnUse">
