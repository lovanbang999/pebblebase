    <ellipse cx="64" cy="54" rx="38" ry="14" fill="#34d399" opacity="0.4" />

    <!-- Layer 3: Top Cylinder Body -->
    <path d="M26 26C26 33.732 43.0132 40 64 40C84.9868 40 102 33.732 102 26V40C102 47.732 84.9868 54 64 54C43.0132 54 26 47.732 26 40V26Z" fill="url(#pb-top-grad)" />
    
    <!-- Layer 3: Top Full Unclipped Ellipse Dome -->
