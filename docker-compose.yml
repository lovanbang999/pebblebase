services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pebble
      POSTGRES_PASSWORD: pebble
      POSTGRES_DB: pebble_test
    ports:
      - "5432:5432"
    volumes:
      - ./testdata/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pebble -d pebble_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pebble
      MYSQL_DATABASE: pebble_test
      MYSQL_USER: pebble
      MYSQL_PASSWORD: pebble
    ports:
      - "3306:3306"
    volumes:
      - ./testdata/seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pebble", "-ppebble"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: pebble
      MONGO_INITDB_ROOT_PASSWORD: pebble
      MONGO_INITDB_DATABASE: pebble_test
    ports:
      - "27017:27017"
    volumes:
      - ./testdata/seed-mongo.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  studio:
    image: lovanbang/pebblebase:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
    volumes:
      - studio_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  studio_data:
